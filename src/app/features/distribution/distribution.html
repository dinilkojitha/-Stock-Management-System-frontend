<div class="space-y-6">
  <div>
    <h1 class="text-xl font-bold text-slate-900">Internal Consumptions</h1>
    <p class="text-xs text-slate-500">Internal requests and department allocations.</p>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
    <table class="w-full text-left border-collapse text-xs">
      <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
      <tr>
        <th class="py-3 px-4">Request #</th>
        <th class="py-3 px-4">Department</th>
        <th class="py-3 px-4">Date</th>
        <th class="py-3 px-4">Status</th>
        <th class="py-3 px-4 text-right">Value</th>
      </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        @for (c of consumptions(); track c.id) {
          <tr class="hover:bg-slate-50 transition">
            <td class="py-3 px-4 font-mono font-medium">{{ c.requestNumber }}</td>
            <td class="py-3 px-4">{{ c.departmentName }}</td>
            <td class="py-3 px-4 text-slate-500">{{ c.date }}</td>
            <td class="py-3 px-4">
                  <span class="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 font-medium">{{
                      c.status
                    }}</span>
            </td>
            <td class="py-3 px-4 text-right font-medium">${{ c.totalCost.toFixed(2) }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
